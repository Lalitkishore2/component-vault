name: Deploy Component Vault to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Firebase Secret Availability
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT == '' }}
        run: |
          echo "Notice: FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT secret is not configured in this repository."
          echo "To enable automatic Firebase Hosting deployments on git push:"
          echo "1. Go to Firebase Console > Project Settings > Service Accounts > Generate new private key."
          echo "2. Add the JSON content as secret FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT in GitHub Settings > Secrets and variables > Actions."

      - name: Deploy to Firebase Hosting (Live Channel on Main)
        if: ${{ github.event_name == 'push' && secrets.FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT }}'
          channelId: live
          projectId: component-vault-e061e

      - name: Deploy to Firebase Hosting (Preview Channel on Pull Request)
        if: ${{ github.event_name == 'pull_request' && secrets.FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMPONENT_VAULT }}'
          expires: 7d
          projectId: component-vault-e061e
