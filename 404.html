<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Hardware Bin Empty | Component Vault</title>
  
  <!-- Streamline Moderne Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400;500;600&family=Raleway:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="icon" href="assets/white-icon.svg" type="image/svg+xml">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      background-color: var(--bg-app);
      font-family: var(--font-body);
      color: var(--text-primary);
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .error-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-teal) 20%, var(--accent-teal) 80%, transparent);
    }
    .error-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .error-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--accent-teal);
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    @media (max-width: 500px) {
      .error-actions {
        flex-direction: column;
      }
      .error-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-logo">
      <img src="assets/white-icon.svg" alt="Component Vault">
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Hardware Bin Not Found</h1>
    <p class="error-desc">The catalog entry, project ledger, or hardware bin location you are trying to access does not exist or has been decommissioned from the laboratory ledger.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">Return to Catalog Vault</a>
      <button type="button" onclick="history.back()" class="btn btn-secondary">Previous Page</button>
    </div>
  </div>
</body>
</html>
